<style>
/* Layout: sticky function index on the left (top bar on phones), one sheet per function; every point carries its own revision note. */
:root {
  --bg: #F3F4F6; --surface: #FFFFFF; --ink: #1B2430; --muted: #5B6675; --line: #DCE0E6;
  --accent: #B42318; --accent-soft: #FDECEA; --note: #FFF6DB; --note-line: #E7C65A; --ok: #1F7A4D; --ok-soft: #E3F4EA;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161C; --surface: #1A2028; --ink: #E7EAEE; --muted: #9AA4B2; --line: #2C3440;
  --accent: #F97066; --accent-soft: #3A1E1C; --note: #3A3218; --note-line: #A88A2C; --ok: #6FCF97; --ok-soft: #173326; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161C; --surface: #1A2028; --ink: #E7EAEE; --muted: #9AA4B2; --line: #2C3440;
  --accent: #F97066; --accent-soft: #3A1E1C; --note: #3A3218; --note-line: #A88A2C; --ok: #6FCF97; --ok-soft: #173326; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.55 }
.wrap { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; max-width: 1180px; margin: 0 auto;
  padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; display: grid; gap: 4px }
nav .brand { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px }
nav a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 13px }
nav a:hover, nav a:focus-visible { background: var(--surface); outline: none }
nav a .id { font-family: var(--font-mono); font-weight: 600 }
nav a .n { font-size: 11px; color: var(--accent); font-weight: 700 }
header.top { display: grid; gap: 10px; margin-bottom: 18px }
h1 { font-size: 26px; margin: 0; text-wrap: balance; letter-spacing: -.01em }
.sub { color: var(--muted); margin: 0; max-width: 70ch }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line) }
.pill b { color: var(--accent) }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer }
.state { font-size: 12px; color: var(--muted) }
section.fn { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 18px; scroll-margin-top: 16px }
.fn-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 6px }
.fn-head .id { font-family: var(--font-mono); font-weight: 600; color: var(--accent); font-size: 15px }
.fn-head h2 { font-size: 18px; margin: 0; text-wrap: balance }
.fn-head .type { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px }
.trigger { color: var(--muted); font-size: 13px; margin: 2px 0 8px }
h3 { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 16px 0 4px }
ol.points { list-style: none; margin: 0; padding: 0; display: grid }
li.pt { display: grid; grid-template-columns: 78px minmax(0, 1fr) auto; gap: 4px 10px; padding: 8px 0; border-top: 1px dashed var(--line) }
li.pt:first-child { border-top: 0 }
.no { font-family: var(--font-mono); font-size: 11px; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; display: flex; gap: 6px; align-items: flex-start; cursor: pointer }
.no input { margin: 2px 0 0; accent-color: var(--ok); cursor: pointer }
li.pt.checked .txt { opacity: .55 }
nav a .prog { font-family: var(--font-mono); font-size: 11px; color: var(--muted) }
.okc { color: var(--ok) !important }
.txt { min-width: 0 }
.txt .k { font-weight: 600 }
.ab { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px 12px; margin-top: 4px; font-size: 13px; color: var(--muted) }
.ab span b { color: var(--ink); font-weight: 600 }
.mtext { margin-top: 2px; font-family: var(--font-mono); font-size: 12.5px; background: var(--bg); border-radius: 4px; padding: 3px 6px; overflow-wrap: anywhere }
.mtype { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted) }
.mtype.t-error, .mtype.t-critical { color: var(--accent); border-color: var(--accent) }
.mtype.t-warning { color: var(--note-line); border-color: var(--note-line) }
.vals q.val { quotes: "\201C" "\201D"; font-style: italic; background: var(--bg); border-radius: 4px; padding: 0 4px }
.vals q.val.t-error, .vals q.val.t-critical { color: var(--accent) }
.vals .sep { color: var(--muted) }
ul.sents { margin: 0; padding-left: 18px; display: grid; gap: 2px }
ul.sents li::marker { color: var(--muted) }
.cbtn { align-self: start; font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; white-space: nowrap }
.cbtn:hover, .cbtn:focus-visible { border-color: var(--accent); color: var(--accent); outline: none }
.cbtn.has { background: var(--note); border-color: var(--note-line) }
.cbtn.done { background: var(--ok-soft); border-color: var(--ok); color: var(--ok) }
.note { grid-column: 2 / 4; background: var(--note); border-left: 3px solid var(--note-line); border-radius: 6px; padding: 8px 10px; display: grid; gap: 6px }
.note.done { background: var(--ok-soft); border-left-color: var(--ok) }
.note .meta { font-size: 11px; color: var(--muted) }
.note textarea { width: 100%; min-height: 64px; font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); resize: vertical }
.note .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.btn { font: inherit; font-size: 12px; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface) }
.btn:disabled { opacity: .5; cursor: default }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.err { color: var(--accent); font-size: 12px }
@media (max-width: 820px) {
  .wrap { grid-template-columns: minmax(0, 1fr) }
  nav { position: static; display: flex; flex-wrap: wrap; gap: 4px }
  nav .brand { width: 100% }
  nav a { padding: 4px 8px; background: var(--surface) }
  li.pt { grid-template-columns: 64px minmax(0, 1fr) }
  .cbtn { grid-column: 2 }
  .note { grid-column: 1 / -1 }
  .ab { grid-template-columns: minmax(0, 1fr) }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto } }
</style>

      { key: 'PL', title: 'Proses normal – Tab Part List (Procurement)', points: [
        'Buka menu: hanya akun Procurement. Default filter Part Number / Part Name kosong, Status All, Sort Newer to Older, 25 baris per halaman. Belum ada part sama sekali: msg 2 dengan [Upload Excel] dan [Add one part].',
        'Cari part: Part Number / Part Name (sebagian kata, tidak membedakan huruf besar kecil), Status Candidate / Active / Inactive, digabung AND; diterapkan saat [Search]. Tidak ada hasil: msg 1. Total Pcs/Day = Pcs/Case × Max Case/Day.',

        'Edit part (Candidate / Active / Inactive): Min MAD, Pcs/Case, Max Case/Day, Status, dan Effective Start Date (hanya selama Candidate, selain itu tooltip msg 10). Part Active menampilkan "Mapped Case/Day (current period)"; Max Case/Day tidak boleh di bawahnya (msg 14). Setelah Save: No Sync, history per field, msg 9.',
        'History (ikon jam): riwayat perubahan part terbaru di atas (Add / Edit, upload, mapping, hasil Sync, status oleh XD05), disimpan tanpa batas waktu. Tanpa history: msg 12.',
        'Download (Export Excel): 2 sheet – "Part List" (hasil filter, informasi) dan "Upload" (semua part, Upload (A/E) = E) sebagai file dasar upload.',
        'Upload part list (XD02): pakai sheet Upload; Upload (A/E) A = part baru, E = edit. Status Candidate tidak bisa diubah lewat upload, Active ↔ Inactive boleh, tidak ada yang bisa jadi Candidate. All-or-nothing; berhasil msg 11.',
        'DAD Calculation (XD05 proses 1): scheduler bulanan, auto retry 3×; [Run calculation] aktif hanya setelah gagal 3× (badge "Scheduled run failed 3x"). Part Active yang jadi Inactive otomatis No Sync.',
        'Setiap Add / Edit / Upload membuat part No Sync, supaya dikirim ulang ke GTOPAS dan AP POLE lewat [Sync].' ] },
      { key: 'MP', title: 'Proses normal – Tab Mapping per Destination (D/S)', points: [
        'Buka menu: hanya akun D/S. Default periode ongoing, Sync Status No Sync. Periode ongoing: semua part Active dengan destinasinya (tanpa destinasi: 0 / quota). Periode baru mulai kosong; periode lalu hanya bisa dilihat.',
        'Kolom Total Case/Day (used / quota): used = jumlah Case/Day semua destinasi, quota = Max Case/Day dari Part List. Pcs/Day = Pcs/Case × used; Percentage = used / quota (maksimal 100%).',
        'Detail (panah di baris): tabel destinasi read only dengan catatan "n case/day left / over". Periode lalu: msg 22. Part tanpa destinasi: msg 19.',
        'Edit mapping (periode ongoing): tambah / ubah / hapus destinasi, satu destinasi sekali per part, [Split evenly]. Save diblok kalau total > Max (msg 20), tanpa destinasi, atau baris tanpa destinasi (msg 21). Disimpan per destinasi: update / insert / delete, yang sama tidak disentuh; history per destinasi; part No Sync.',
        'Download: sheet "Mapping per Destination" (informasi) dan "Upload" (part Active periode ongoing, satu baris per destinasi; baris kosong Upload (A/E) = A untuk part tanpa mapping).',

        'Mapping Calculation (XD05 proses 2): scheduler, auto retry 3×; [Run calculation] aktif hanya setelah gagal 3×; selesai msg 29.',
        '[Sync (n)]: part Active periode ongoing dan part yang baru jadi Inactive dengan status No Sync / Failed, tanpa melihat filter. Part jadi Waiting, XD06 dan XD07 dijalankan (msg 27). Part Candidate tidak pernah di-sync.',
        'Hasil Sync per part: Success kalau GTOPAS (RPA) dan AP POLE (SFTP) berhasil; Failed kalau salah satu gagal (tooltip msg 28, ikut Sync berikutnya); No Sync kalau part diubah saat proses kirim. Setiap hasil masuk history.' ] },

  { id: 'XD02', name: 'Cross Dock Part Master Upload Batch', type: 'Batch', trigger: '[Validate file] di Upload Excel tab Part List (XD01)',

      { key: 'N', title: 'Proses normal', points: [

// ---------- app ----------
const { useState, useEffect, useMemo, useRef } = React;
const pid = (f, s, i) => `${f}-${s}-${String(i + 1).padStart(2, '0')}`;
const msgLookup = (fn, ref) => {
  const id = /^msg/i.test(ref) ? 'MSG' + ref.replace(/\D/g, '') : ref.replace(/\s/g, '');
  return (MSGS[fn] || []).find((m) => m.id === id);
};
// Show the message text (value) in place of its reference: "msg 14", "msg 5 / 15 / 6 / 7", "LOG4", "LOG3 / LOG10".
function Refs({ text, fn }) {
  const re = /(\bmsg \d+(?:\s*\/\s*\d+)*|\bLOG\d+(?:\s*\/\s*LOG\d+)*)/g;
  const parts = String(text).split(re);
  return parts.map((t, i) => {
    if (i % 2 === 0) return t;
    const refs = /^msg/i.test(t) ? t.replace(/^msg\s*/i, '').split('/').map((n) => 'msg ' + n.trim()) : t.split('/').map((n) => n.trim());
    const found = refs.map((r) => msgLookup(fn, r));
    if (found.some((m) => !m)) return t;
    return (
      <span key={i} className="vals">
        {found.map((m, k) => (
          <React.Fragment key={k}>
            {k > 0 && <span className="sep"> / </span>}
            <q className={'val t-' + String(m.type).toLowerCase()} title={m.kind === 'Log' ? 'Logging message' : 'Screen message'}>{m.message}</q>
          </React.Fragment>
        ))}
      </span>
    );
  });
}
// One bullet per sentence (split after a full stop followed by a new sentence); a single sentence stays plain text.
function Sentences({ text, fn }) {
  const parts = String(text).split(/(?<=\.)\s+(?=[A-Z0-9\[\u201C"(])/);
  if (parts.length < 2) return <Refs text={text} fn={fn} />;
  return <ul className="sents">{parts.map((t, i) => <li key={i}><Refs text={t} fn={fn} /></li>)}</ul>;
}
const fmtTime = (iso) => { try { return new Date(iso).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return iso; } };

function useRevisions() {
  const [db, setDb] = useState(null);
  const [notes, setNotes] = useState({});
  const [checks, setChecks] = useState({});
  const [state, setState] = useState('loading'); // loading | live | offline | stale
  useEffect(() => {
    let unsub = null, unsub2 = null, timer = null, alive = true;
    (async () => {
      const c = window.claude && (await window.claude.use('db'));
      if (!alive) return;
      if (!c) { setState('offline'); return; }
      setDb(c);
      timer = setTimeout(() => setState((s) => (s === 'loading' ? 'stale' : s)), 10000);
      unsub = c.collection('revisions').onSnapshot((snap) => {
        const m = {};
        snap.docs.forEach((d) => { if (d.exists) m[d.id] = d.data(); });
        setNotes(m);
        if (!snap.metadata.fromCache) { clearTimeout(timer); setState('live'); }
      }, () => { clearTimeout(timer); setState('stale'); });
      unsub2 = c.collection('checks').onSnapshot((snap) => {
        const m = {};
        snap.docs.forEach((d) => { if (d.exists) m[d.id] = d.data(); });
        setChecks(m);
      }, () => setState('stale'));
    })();
    return () => { alive = false; if (unsub) unsub(); if (unsub2) unsub2(); clearTimeout(timer); };
  }, []);
  return { db, notes, checks, state };
}

function Point({ id, seq, fn, point, note, db, open, onToggle, checked, onCheck }) {
  const [draft, setDraft] = useState(note ? note.comment : '');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  useEffect(() => { if (!open) setDraft(note ? note.comment : ''); }, [note, open]);
  const text = typeof point === 'string' ? point : point.msg ? point.msg.message : point.k;
  const save = async (status) => {
    if (!db) return;
    setBusy(true); setErr('');
    try {
      const ref = db.collection('revisions').doc(id);
      if (!draft.trim() && status === 'open') await ref.delete();
      else await ref.set({ fn, point: text, comment: draft.trim(), status, updatedAt: new Date().toISOString() });
      if (status === 'open') onToggle(false);
    } catch (e) { setErr('Komentar belum tersimpan (' + (e && e.code ? e.code : 'error') + '). Coba lagi.'); }
    setBusy(false);
  };
  const cls = note ? (note.status === 'done' ? 'cbtn done' : 'cbtn has') : 'cbtn';
  return (
    <li className={'pt' + (checked ? ' checked' : '')}>
      <label className="no" htmlFor={'c-' + id} title="Tandai sudah dicek">
        <input id={'c-' + id} type="checkbox" checked={!!checked} disabled={!db} onChange={(e) => onCheck(id, e.target.checked)} />
        <span>{seq || id.split('-').slice(1).join('-')}</span>
      </label>
      <div className="txt">
        {typeof point === 'string' ? <Sentences text={point} fn={fn} /> : point.msg ? (
          <>
            <span className={'mtype t-' + String(point.msg.type).toLowerCase()}>{point.msg.kind === 'Log' ? 'Logging · ' : 'Screen · '}{point.msg.type}</span>
            <div className="mtext">{point.msg.message}</div>
            <div className="ab">
              <span><b>Event:</b> {point.msg.event || '–'}</span>
              <span><b>Cause:</b> {point.msg.cause || '–'}</span>
              <span><b>Action:</b> {point.msg.action || '–'}</span>
            </div>
          </>
        ) : (
          <>
            <span className="k">{point.k}</span>
            <div className="ab">
              <span><b>Deteksi:</b> <Refs text={point.d} fn={fn} /></span>
              <span><b>Sistem:</b> {point.s}</span>
              <span><b>User:</b> {point.u}</span>
            </div>
          </>
        )}
      </div>
      <button type="button" className={cls} onClick={() => onToggle(!open)} aria-expanded={open} aria-controls={'n-' + id}>
        {note ? (note.status === 'done' ? 'Selesai' : 'Ada revisi') : 'Komentar'}
      </button>
      {(open || note) && (
        <div className={'note' + (note && note.status === 'done' ? ' done' : '')} id={'n-' + id}>
          {open ? (
            <>
              <textarea id={'t-' + id} value={draft} onChange={(e) => setDraft(e.target.value)} placeholder="Tulis revisi atau pertanyaan untuk poin ini" disabled={!db} />
              <div className="row">
                <button type="button" className="btn primary" disabled={busy || !db} onClick={() => save('open')}>{draft.trim() ? 'Simpan' : 'Hapus komentar'}</button>
                {note && <button type="button" className="btn" disabled={busy} onClick={() => save(note.status === 'done' ? 'open' : 'done')}>{note.status === 'done' ? 'Buka lagi' : 'Tandai selesai'}</button>}
                <button type="button" className="btn" onClick={() => onToggle(false)}>Tutup</button>
                {!db && <span className="err">Komentar hanya bisa disimpan saat halaman dibuka di claude.ai dan sudah login.</span>}
                {err && <span className="err">{err}</span>}
              </div>
            </>
          ) : (
            <>
              <div>{note.comment}</div>
              <div className="meta">{note.status === 'done' ? 'Selesai · ' : 'Revisi · '}{fmtTime(note.updatedAt)}</div>
            </>
          )}
        </div>
      )}
    </li>
  );
}

function App() {
  const { db, notes, checks, state } = useRevisions();
  const [hideChecked, setHideChecked] = useState(false);
  const [checkErr, setCheckErr] = useState('');
  const onCheck = async (id, val) => {
    if (!db) return;
    setCheckErr('');
    try {
      const ref = db.collection('checks').doc(id);
      if (val) await ref.set({ fn: id.split('-')[0], checked: true, updatedAt: new Date().toISOString() });
      else await ref.delete();
    } catch (e) { setCheckErr('Checklist belum tersimpan (' + (e && e.code ? e.code : 'error') + '). Coba lagi.'); }
  };
  const perFn = useMemo(() => {
    const m = {};
    FUNCS.forEach((f) => { m[f.id] = { total: f.sections.reduce((b, s) => b + s.points.length, 0) + (MSGS[f.id] || []).length, done: 0 }; });
    Object.keys(checks).forEach((k) => { const f = k.split('-')[0]; if (m[f]) m[f].done++; });
    return m;
  }, [checks]);
  const checkedTotal = Object.values(perFn).reduce((a, x) => a + x.done, 0);
  const [openId, setOpenId] = useState(null);
  const [onlyNotes, setOnlyNotes] = useState(false);
  const counts = useMemo(() => {
    const m = {}; let open = 0, done = 0;
    Object.values(notes).forEach((n) => { m[n.fn] = (m[n.fn] || 0) + (n.status === 'done' ? 0 : 1); if (n.status === 'done') done++; else open++; });
    return { m, open, done };
  }, [notes]);
  const total = FUNCS.reduce((a, f) => a + f.sections.reduce((b, s) => b + s.points.length, 0) + (MSGS[f.id] || []).length, 0);
  const stateText = { loading: 'Memuat komentar…', live: 'Komentar tersimpan bersama', stale: 'Komentar belum bisa dimuat; data mungkin belum terbaru', offline: 'Mode baca: komentar tidak tersedia di tampilan ini' }[state];
  return (
    <div className="wrap">
      <nav aria-label="Function">
        <span className="brand">Function list</span>
        {FUNCS.map((f) => (
          <a key={f.id} href={'#' + f.id}><span><span className="id">{f.id}</span> <span className="prog">{perFn[f.id].done}/{perFn[f.id].total}</span></span>{counts.m[f.id] ? <span className="n">{counts.m[f.id]}</span> : null}</a>
        ))}
      </nav>
      <main style={{ minWidth: 0 }}>
        <header className="top">
          <h1>Crossdock Function Summary</h1>
          <p className="sub">Ringkasan proses normal, aturan dan abnormality XD01–XD15 (GTOPAS / NSP), dari UISS terbaru. Setiap poin punya tombol Komentar untuk revisi; komentar tersimpan dan dibaca Claude untuk revisi dokumen.</p>
          <div className="bar">
            <span className="pill">{FUNCS.length} function · {total} poin</span>
            <span className="pill">Revisi terbuka <b>{counts.open}</b></span>
            <span className="pill">Selesai {counts.done}</span>
            <span className="pill">Sudah dicek <b className="okc">{checkedTotal}</b> / {total}</span>
            <label className="toggle" htmlFor="hidechk"><input id="hidechk" type="checkbox" checked={hideChecked} onChange={(e) => setHideChecked(e.target.checked)} /> Sembunyikan yang sudah dicek</label>
            {checkErr && <span className="err">{checkErr}</span>}
            <label className="toggle" htmlFor="only"><input id="only" type="checkbox" checked={onlyNotes} onChange={(e) => setOnlyNotes(e.target.checked)} /> Hanya poin dengan komentar</label>
            <span className="state" role="status">{stateText}</span>
          </div>
        </header>
        {FUNCS.map((f) => {
          const all = (MSGS[f.id] || []).length ? f.sections.concat([{ key: 'MSG', title: 'Message (breakdown)', points: MSGS[f.id].map((m) => ({ msg: m })) }]) : f.sections;
          const secs = all.map((s) => ({ s, items: s.points.map((p, i) => ({ p, id: p.msg ? f.id + '-MSG-' + p.msg.id : pid(f.id, s.key, i), seq: p.msg ? 'MSG-' + String(i + 1).padStart(2, '0') : '' })).filter((x) => (!onlyNotes || notes[x.id]) && (!hideChecked || !checks[x.id])) })).filter((x) => x.items.length);
          if ((onlyNotes || hideChecked) && !secs.length) return null;
          return (
            <section className="fn" id={f.id} key={f.id}>
              <div className="fn-head"><span className="id">{f.id}</span><h2>{f.name}</h2><span className="type">{f.type}</span></div>
              <p className="trigger">{f.trigger}</p>
              {secs.map(({ s, items }) => (
                <div key={s.key}>
                  <h3>{s.title}</h3>
                  <ol className="points">
                    {items.map(({ p, id, seq }) => (
                      <Point key={id} id={id} seq={seq} fn={f.id} point={p} note={notes[id]} checked={checks[id]} onCheck={onCheck} db={db} open={openId === id} onToggle={(v) => setOpenId(v ? id : null)} />
                    ))}
                  </ol>
                </div>
              ))}
            </section>
          );
        })}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
